<div class="relative rounded-lg border border-zinc-800 bg-zinc-900 overflow-hidden">
  @if (label) {
    <div class="flex items-center justify-between px-4 py-2 border-b border-zinc-800">
      <span
        class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded"
        [class]="labelClass ?? 'text-zinc-400'"
      >
        {{ label }}
      </span>
      <button
        (click)="copyToClipboard()"
        class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer"
      >
        {{ copied() ? '✓ Copied' : 'Copy' }}
      </button>
    </div>
  } @else {
    <button
      (click)="copyToClipboard()"
      class="absolute top-3 right-3 text-xs text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer"
    >
      {{ copied() ? '✓' : 'Copy' }}
    </button>
  }
  <pre class="p-4 text-sm leading-relaxed overflow-x-auto text-zinc-300 whitespace-pre"><code>{{ code }}</code></pre>
</div>
