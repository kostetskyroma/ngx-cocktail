<div class="rounded-lg border border-emerald-800/50 bg-emerald-950/30 p-4 h-full">
  <div class="flex items-center justify-between mb-3">
    <span class="text-sm font-semibold text-emerald-400">With DestroyableFeature</span>
    <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 ring-1 ring-emerald-500/30">
      CLEAN
    </span>
  </div>

  <div class="text-center py-4">
    <div class="text-5xl font-bold tabular-nums text-emerald-300" data-testid="counter">
      {{ counter() }}
    </div>
    <div class="mt-2 text-xs text-emerald-600">ticks since mount</div>
  </div>

  <div class="mt-3 text-xs text-zinc-500 space-y-1">
    <div class="flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>interval subscription running</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      <span>takeUntil(this.destroyed$)</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      <span>on unmount → counter stops</span>
    </div>
  </div>
</div>
